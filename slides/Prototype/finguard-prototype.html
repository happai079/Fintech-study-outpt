<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinGuard 프로토타입 · 미래 금융 부담 분석</title>
<style>
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R4 V5
 * Hallmark · genre: modern-minimal · macrostructure: Workbench · nav: N9 edge-aligned minimal · footer: Ft2 inline single line
 * theme: custom (tuned) · vibe: "핀테크 앱 · 깔끔 · 친근 · 큰 숫자"
 *   paper  oklch(96.5% 0.003 250) · accent oklch(56% 0.185 259) cool
 *   type   Pretendard (single-family — genre-sanctioned modern-minimal discipline) · numerals tabular
 *   axes   paper-band: light · display-style: geometric-sans · accent-hue: cool
 * enrichment: Tier-B hand-built SVG — 20-glyph 24px line set (1.7 stroke) + cash-flow chart. No photos, no emoji.
 * motion: 2 primitives — screen-enter · press-feedback. Collapses under prefers-reduced-motion.
 * chrome: no device bezel / notch / fake status bar (gate 47) — screens sit in a hairline <figure>.
 * slop test: contrast pass (40–41) · nav/footer/hero pass (42–45) · honest pass (46) · chrome pass (47)
 *            tokens pass (48) · responsive pass (49) · icons pass (30) · mobile pass (34, 49, 50–57)
 *            gate 24 — 4pt scale holds for all rhythm spacing; 1–2px optical nudges on icon/label
 *            baselines are a declared deviation (rounding them to 4px misaligns the glyphs).
 *            gate 25 — measure is ~23–30 CJK chars/line (Korean optimum); the 45–75ch rule is Latin-set.
 * tokens mirrored in ./tokens.css
 */
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");

:root{
  --color-paper:oklch(96.5% 0.003 250);
  --color-surface:oklch(99.4% 0.004 250);
  --color-surface-2:oklch(97.4% 0.004 250);
  --color-surface-3:oklch(95.4% 0.005 252);
  --color-ink:oklch(24% 0.018 264);
  --color-ink-2:oklch(46% 0.020 258);
  --color-ink-3:oklch(58% 0.017 254);
  --color-ink-4:oklch(72% 0.012 252);
  --color-line:oklch(92.4% 0.005 252);
  --color-line-soft:oklch(95.2% 0.004 252);
  --color-accent:oklch(56% 0.185 259);
  --color-accent-strong:oklch(49% 0.170 259);
  --color-accent-weak:oklch(95.6% 0.026 259);
  --color-accent-line:oklch(88% 0.055 259);
  --color-accent-ink:oklch(99.4% 0.004 250);   /* accent 면 위의 글자/아이콘 — 대비 5.0:1 */
  --color-danger:oklch(56% 0.190 22);
  --color-danger-weak:oklch(95.4% 0.028 22);
  --color-warn:oklch(54% 0.130 62);
  --color-warn-weak:oklch(96% 0.035 70);
  --color-ok:oklch(54% 0.130 158);
  --color-ok-weak:oklch(95.4% 0.032 158);
  --color-focus:oklch(56% 0.185 259);
  --color-scrim:oklch(24% 0.018 264 / .42);

  --font-display:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --font-body:var(--font-display);

  --text-2xs:.6875rem; --text-xs:.75rem; --text-sm:.8125rem; --text-md:.9375rem;
  --text-lg:1.0625rem; --text-xl:1.25rem; --text-2xl:1.5rem; --text-3xl:1.875rem; --text-display:2.25rem;

  --space-2xs:.25rem; --space-xs:.5rem; --space-sm:.75rem; --space-md:1rem;
  --space-lg:1.25rem; --space-xl:1.5rem; --space-2xl:2rem; --space-3xl:2.5rem;

  --radius-xs:6px; --radius-sm:10px; --radius-md:14px; --radius-lg:18px;
  --radius-xl:22px; --radius-2xl:28px; --radius-pill:999px;

  --rule-hair:1px;
  --shadow-card:0 1px 2px oklch(24% 0.018 264 / .05);
  --shadow-lift:0 1px 2px oklch(24% 0.018 264 / .06), 0 18px 40px -26px oklch(24% 0.018 264 / .28);
  --shadow-dock:0 -12px 20px -18px oklch(24% 0.018 264 / .35);

  --dur-instant:90ms; --dur-short:140ms; --dur-mid:240ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.55,0,1,.45); --ease-in-out:cubic-bezier(.65,0,.35,1);

  --z-sticky:10; --z-dock:20; --z-shell:30; --z-modal:40; --z-toast:50;
}

/* ── reset ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow-x:clip}
body{
  overflow-y:hidden;
  background:var(--color-paper); color:var(--color-ink);
  font-family:var(--font-body); font-size:var(--text-md); line-height:1.5;
  font-feature-settings:"tnum" 0; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0; overflow-wrap:anywhere; min-width:0}
:focus-visible{outline:2px solid var(--color-focus); outline-offset:2px; border-radius:var(--radius-xs)}
svg.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── shell (viewport-locked · N9 nav + Ft2 status line) ───────────── */
.shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.topbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-xs) var(--space-md);
  padding:var(--space-sm) var(--space-lg);
  border-bottom:var(--rule-hair) solid var(--color-line);
  background:var(--color-surface); z-index:var(--z-shell);
}
.mark{display:flex;align-items:center;gap:var(--space-xs);font-weight:800;letter-spacing:-.03em;font-size:var(--text-lg);white-space:nowrap}
.mark .glyph{width:26px;height:26px;border-radius:var(--radius-xs);background:var(--color-accent);color:var(--color-accent-ink);display:grid;place-items:center}
.mark .glyph svg{width:15px;height:15px;stroke-width:2}
.mark .sub{font-size:var(--text-xs);font-weight:600;color:var(--color-ink-3);letter-spacing:0}
.topbar .gap{flex:1}
.seg{display:flex;gap:var(--space-2xs);background:var(--color-surface-3);border-radius:var(--radius-sm);padding:var(--space-2xs)}
.seg button{font-size:var(--text-xs);font-weight:700;color:var(--color-ink-2);padding:0 var(--space-sm);min-height:34px;
  border-radius:var(--radius-xs);white-space:nowrap;
  transition:color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out)}
.seg button:hover{color:var(--color-ink)}
.seg button[aria-pressed="true"]{background:var(--color-surface);color:var(--color-ink);box-shadow:var(--shadow-card)}
.tbtn{font-size:var(--text-xs);font-weight:700;color:var(--color-ink-2);padding:var(--space-xs) var(--space-sm);
  border-radius:var(--radius-sm);white-space:nowrap;
  transition:background-color var(--dur-short) var(--ease-out)}
.tbtn:hover{background:var(--color-surface-3)}
.tbtn:active,.iconbtn:active,.linkbtn:active,.chips button:active,.seg button:active{opacity:.72}
.spec-toggle{display:none}

.work{display:grid;grid-template-columns:236px minmax(0,1fr) 312px;gap:var(--space-lg);
  padding:var(--space-lg);min-height:0}

/* ── screen index rail ─────────────────────────────────────────────── */
.rail{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-2xs);padding-right:var(--space-2xs)}
.rail-h{font-size:var(--text-2xs);font-weight:800;color:var(--color-ink-3);letter-spacing:.04em;padding:var(--space-2xs) var(--space-sm) var(--space-xs)}
.rail button{display:flex;gap:var(--space-sm);align-items:flex-start;text-align:left;padding:var(--space-sm);border-radius:var(--radius-sm);
  transition:background-color var(--dur-short) var(--ease-out)}
.rail button:hover{background:var(--color-surface-2)}
.rail button[aria-current="true"]{background:var(--color-surface)}
.rail .n{flex:none;width:20px;height:20px;border-radius:var(--radius-xs);background:var(--color-surface-3);color:var(--color-ink-3);
  font-size:var(--text-2xs);font-weight:800;display:grid;place-items:center;margin-top:1px}
.rail button[aria-current="true"] .n{background:var(--color-accent);color:var(--color-accent-ink)}
.rail .t{font-size:var(--text-sm);font-weight:700;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button[aria-current="true"] .t{color:var(--color-accent)}
.rail .d{font-size:var(--text-2xs);color:var(--color-ink-3);font-weight:500;line-height:1.35;display:block;margin-top:1px}

/* ── stage · the workbench ─────────────────────────────────────────── */
.stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.device{margin:0;height:100%;max-height:812px;width:min(392px,100%);display:flex;flex-direction:column;
  border:var(--rule-hair) solid var(--color-line);border-radius:var(--radius-2xl);background:var(--color-paper);
  box-shadow:var(--shadow-lift);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--color-paper)}

.gallery{display:none;height:100%;width:100%;gap:var(--space-lg);overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;padding-bottom:var(--space-xs)}
.gallery.on{display:flex}
.stage.gallery-mode{display:block}
.film{flex:none;width:296px;height:100%;display:flex;flex-direction:column;gap:var(--space-xs);scroll-snap-align:start;min-height:0}
.film figcaption{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--text-xs);font-weight:700;color:var(--color-ink-2);padding-left:2px}
.film figcaption .n{width:17px;height:17px;border-radius:var(--radius-xs);background:var(--color-accent);color:var(--color-accent-ink);
  font-size:9px;font-weight:800;display:grid;place-items:center}
.film .device{height:auto;flex:1;max-height:none;width:100%;border-radius:var(--radius-xl)}

/* ── spec panel ────────────────────────────────────────────────────── */
.spec{min-height:0;overflow-y:auto;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-lg);box-shadow:var(--shadow-card)}
.spec h3{font-size:var(--text-md);font-weight:800;letter-spacing:-.02em}
.spec .lede{font-size:var(--text-xs);color:var(--color-ink-3);margin-top:2px}
.spec h4{font-size:var(--text-2xs);font-weight:800;color:var(--color-ink-3);letter-spacing:.03em;margin:var(--space-lg) 0 var(--space-xs)}
.spec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--space-xs)}
.spec li{font-size:var(--text-xs);color:var(--color-ink-2);line-height:1.5;padding-left:var(--space-sm);border-left:2px solid var(--color-line)}
.spec li.acc{border-left-color:var(--color-accent-line)}
.spec .close{display:none}

/* ── status line (Ft2) ─────────────────────────────────────────────── */
.statusline{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;
  padding:var(--space-sm) var(--space-lg);border-top:var(--rule-hair) solid var(--color-line);
  background:var(--color-surface);font-size:var(--text-2xs);color:var(--color-ink-3)}
.statusline .dot{width:3px;height:3px;border-radius:50%;background:var(--color-ink-4);flex:none}

/* ══ app UI ═══════════════════════════════════════════════════════════ */
.appbar{display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-lg) var(--space-lg) var(--space-sm);
  background:var(--color-paper);flex:none}
.apptitle{font-size:var(--text-xl);font-weight:800;letter-spacing:-.035em}
.appbar .act{margin-left:auto;display:flex;align-items:center;gap:var(--space-2xs);font-size:var(--text-xs);font-weight:700;color:var(--color-ink-3);white-space:nowrap}
.iconbtn{width:32px;height:32px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-ink-2);margin-left:-6px;
  transition:background-color var(--dur-short) var(--ease-out)}
.iconbtn:hover{background:var(--color-surface-3)}
.iconbtn svg{width:20px;height:20px}
.appscroll{flex:1;min-height:0;overflow-y:auto;padding:0 var(--space-lg) var(--space-xl);scrollbar-width:thin}
.appscroll::-webkit-scrollbar{width:5px}
.appscroll::-webkit-scrollbar-thumb{background:var(--color-line);border-radius:var(--radius-pill)}

.enter{animation:enter var(--dur-mid) var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.lede{font-size:var(--text-md);color:var(--color-ink-2);line-height:1.55}
.headline{font-size:var(--text-2xl);font-weight:800;letter-spacing:-.035em;line-height:1.32}
.card{background:var(--color-surface);border-radius:var(--radius-xl);padding:var(--space-lg);box-shadow:var(--shadow-card)}
.card + .card{margin-top:var(--space-sm)}
.card.flat{background:var(--color-surface-2);box-shadow:none}
.card.tint-b{background:var(--color-accent-weak);box-shadow:none}
.card.tint-g{background:var(--color-ok-weak);box-shadow:none}
.card.pad-list{padding:var(--space-2xs) var(--space-lg)}
.sec{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--space-xs);margin:var(--space-xl) 0 var(--space-sm)}
.sec h3{font-size:var(--text-lg);font-weight:800;letter-spacing:-.03em}
.sec .note{margin-left:auto;font-size:var(--text-xs);color:var(--color-ink-3);font-weight:600}

.row{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) 0;min-height:56px;width:100%;text-align:left}
.row + .row{border-top:var(--rule-hair) solid var(--color-line-soft)}
.row .grow{flex:1;min-width:0}
.row .end{text-align:right;flex:none}
.tap{transition:transform var(--dur-instant) var(--ease-out)}
.tap:active{transform:scale(.988)}
.av{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;flex:none;
  background:var(--color-surface-3);color:var(--color-ink-2)}
.av svg{width:20px;height:20px}
.av.b{background:var(--color-accent-weak);color:var(--color-accent)}
.av.d{background:var(--color-danger-weak);color:var(--color-danger)}
.av.w{background:var(--color-warn-weak);color:var(--color-warn)}
.av.g{background:var(--color-ok-weak);color:var(--color-ok)}

.t-name{display:block;font-size:var(--text-md);font-weight:700;letter-spacing:-.015em}
.t-sub{display:block;font-size:var(--text-xs);color:var(--color-ink-3);margin-top:1px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt{font-size:var(--text-md);font-weight:700}
.big{font-size:var(--text-3xl);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.huge{font-size:var(--text-display);font-weight:800;letter-spacing:-.045em;line-height:1.05}
.muted{color:var(--color-ink-3)}
.ink2{color:var(--color-ink-2)}
.c-b{color:var(--color-accent)} .c-d{color:var(--color-danger)} .c-w{color:var(--color-warn)} .c-g{color:var(--color-ok)}
.xs{font-size:var(--text-xs)} .sm{font-size:var(--text-sm)}
.b7{font-weight:700} .b8{font-weight:800}
.strike{text-decoration:line-through;color:var(--color-ink-3)}

.tag{display:inline-flex;align-items:center;gap:var(--space-2xs);font-size:var(--text-2xs);font-weight:700;
  padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-pill);
  background:var(--color-surface-3);color:var(--color-ink-2);white-space:nowrap}
.tag.b{background:var(--color-accent-weak);color:var(--color-accent)}
.tag.d{background:var(--color-danger-weak);color:var(--color-danger)}
.tag.w{background:var(--color-warn-weak);color:var(--color-warn)}
.tag.g{background:var(--color-ok-weak);color:var(--color-ok)}

.chips{display:flex;gap:var(--space-xs);overflow-x:auto;padding-bottom:var(--space-2xs);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:var(--text-sm);font-weight:700;color:var(--color-ink-2);background:var(--color-surface);
  padding:0 var(--space-md);min-height:38px;border-radius:var(--radius-pill);white-space:nowrap;
  transition:background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out)}
.chips button:hover{color:var(--color-ink)}
.chips button[aria-pressed="true"]{background:var(--color-ink);color:var(--color-paper)}

.mark-box{width:22px;height:22px;border-radius:var(--radius-xs);border:1.5px solid var(--color-line);flex:none;
  display:grid;place-items:center;color:var(--color-surface);background:var(--color-surface);
  transition:background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out)}
.mark-box.round{border-radius:50%}
.mark-box svg{width:14px;height:14px;stroke-width:2.6;opacity:0;transition:opacity var(--dur-short) var(--ease-out)}
.mark-box{color:var(--color-accent-ink)}
.mark-box.on{background:var(--color-accent);border-color:var(--color-accent)}
.mark-box.on svg{opacity:1}

.gauge{margin-top:var(--space-md)}
.gauge-track{display:flex;gap:var(--space-2xs);height:8px}
.gauge-track i{flex:1;border-radius:var(--radius-pill);background:var(--color-surface-3)}
.gauge-track i.on-g{background:var(--color-ok)} .gauge-track i.on-w{background:var(--color-warn)} .gauge-track i.on-d{background:var(--color-danger)}
.gauge-scale{display:flex;justify-content:space-between;font-size:var(--text-2xs);color:var(--color-ink-3);margin-top:var(--space-2xs)}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--color-surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-accent)}
.bar i.w{background:var(--color-warn)} .bar i.d{background:var(--color-danger)} .bar i.g{background:var(--color-ok)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);padding:var(--space-xs) 0;font-size:var(--text-sm)}
.kv + .kv{border-top:var(--rule-hair) solid var(--color-line-soft)}
.hr{height:var(--rule-hair);background:var(--color-line-soft);margin:var(--space-md) calc(var(--space-lg) * -1)}

.note{display:flex;gap:var(--space-xs);font-size:var(--text-xs);line-height:1.55;color:var(--color-ink-2);
  background:var(--color-surface-2);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);margin-top:var(--space-md)}
.note svg{width:16px;height:16px;margin-top:1px;color:var(--color-ink-3)}
.note.warn{background:var(--color-warn-weak);color:var(--color-warn)}
.note.warn svg{color:var(--color-warn)}
.note.info{background:var(--color-accent-weak);color:var(--color-accent-strong)}
.note.info svg{color:var(--color-accent)}

.steps{display:flex;flex-direction:column;gap:var(--space-md)}
.step{display:flex;gap:var(--space-sm)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--color-accent-weak);color:var(--color-accent);
  font-size:var(--text-2xs);font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}

.daygroup + .daygroup{margin-top:var(--space-md)}
.dayhead{font-size:var(--text-xs);font-weight:700;color:var(--color-ink-3);padding:0 0 var(--space-2xs) 2px}

.pick{display:block;width:100%;text-align:left;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-md);
  box-shadow:var(--shadow-card);margin-top:var(--space-xs);
  transition:box-shadow var(--dur-short) var(--ease-out), transform var(--dur-instant) var(--ease-out)}
.pick:active{transform:scale(.99)}
.pick[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--color-accent)}

.dock{flex:none;padding:var(--space-sm) var(--space-lg) var(--space-md);background:var(--color-paper);box-shadow:var(--shadow-dock)}
.stack{display:flex;flex-direction:column;gap:var(--space-xs)}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--space-xs);width:100%;min-height:56px;padding:0 var(--space-md);
  border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-accent-ink);
  font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em;white-space:nowrap;
  transition:background-color var(--dur-short) var(--ease-out), transform var(--dur-instant) var(--ease-out)}
.btn:hover{background:var(--color-accent-strong)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--color-surface-3);color:var(--color-ink-3);cursor:not-allowed;transform:none}
.btn.ghost{background:var(--color-surface-3);color:var(--color-ink)}
.btn.ghost:hover{background:var(--color-line)}
.btn.quiet{background:transparent;color:var(--color-ink-2);min-height:46px;font-size:var(--text-md);font-weight:600}
.btn.quiet:hover{background:var(--color-surface-3)}
.btn.danger{background:transparent;color:var(--color-danger);min-height:48px;font-size:var(--text-md)}
.btn.danger:hover{background:var(--color-danger-weak)}
.btn.sm{min-height:52px;font-size:var(--text-md)}
.linkbtn{font-size:var(--text-sm);font-weight:700;color:var(--color-accent);white-space:nowrap;

/* charts */
.chart{display:block;width:100%}
.cf-line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.cf-pos{stroke:var(--color-accent)}
.cf-neg{stroke:var(--color-danger)}
.cf-prev{fill:none;stroke:var(--color-ink-3);stroke-width:1.8;stroke-dasharray:4 3}
.cf-zero{stroke:var(--color-ink-4);stroke-width:1}
.cf-pay{stroke:var(--color-ok);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.cf-tick{fill:var(--color-ink-3);font-size:9px;font-family:var(--font-body)}
.cf-fill-pos-a{stop-color:var(--color-accent);stop-opacity:.26}
.cf-fill-pos-b{stop-color:var(--color-accent);stop-opacity:.02}
.cf-fill-neg-a{stop-color:var(--color-danger);stop-opacity:.05}
.cf-fill-neg-b{stop-color:var(--color-danger);stop-opacity:.26}
.legend{display:flex;gap:var(--space-md);flex-wrap:wrap;font-size:var(--text-2xs);color:var(--color-ink-3);margin-top:var(--space-xs)}
.legend span{display:flex;align-items:center;gap:var(--space-2xs)}
.legend i{width:12px;height:3px;border-radius:var(--radius-pill);display:block;background:var(--color-ink-3)}
.legend i.b{background:var(--color-accent)} .legend i.d{background:var(--color-danger)} .legend i.g{background:var(--color-ok)}

.mbar .col.est{background:var(--color-accent-line)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:var(--color-scrim);display:grid;place-items:end center;z-index:var(--z-modal);padding:var(--space-md)}
.sheet{background:var(--color-surface);border-radius:var(--radius-xl);width:100%;max-width:380px;padding:var(--space-xl);
  box-shadow:var(--shadow-lift);max-height:88dvh;overflow-y:auto;
  animation:sheet var(--dur-mid) var(--ease-out) both}
@keyframes sheet{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet h3{font-size:var(--text-xl);font-weight:800;letter-spacing:-.03em}
.field{margin-top:var(--space-md)}
.field label{display:block;font-size:var(--text-xs);font-weight:700;color:var(--color-ink-2);margin-bottom:var(--space-xs)}

.hidden{display:none !important}

/* ═════════════════════════════════════════════════════════════════════
   4 · 분석 엔진 — 예정 지출 → 일별 잔액 → 위험 점수
   ═════════════════════════════════════════════════════════════════════ */
function allItems(){ return BASE_ITEMS.concat(S.customFixed); }

function activeItems(a){
  return allItems().map(it => {
    const o = Object.assign({}, it);
    if (a.cardShift && it.id === "card"){ o.day = 26; o.shifted = true; }
    if (a.cutSubs  && it.id === "subs"){  o.removed = true; }
    return o;
  }).filter(it => !it.removed);
}

function simulate(a){
  const list = activeItems(a);
  const daily = a.spendCap ? CAP_DAILY : BASE_DAILY;
  const byDay = {};
  list.forEach(it => { (byDay[it.day] = byDay[it.day] || []).push(it); });

  let bal = START_BALANCE;
  const series = [{ day:0, bal }];
  let firstShort = null, shortDays = 0, maxShortfall = 0, minBal = bal;

  for (let d = 1; d <= DAYS; d++){
    (byDay[d] || []).forEach(it => bal -= it.amount);
    if (d === INCOME.day) bal += INCOME.amount;
    bal -= daily;
    series.push({ day:d, bal });
    if (bal < 0){
      if (firstShort === null) firstShort = d;
      shortDays++;
      maxShortfall = Math.max(maxShortfall, -bal);
    }
    minBal = Math.min(minBal, bal);
  }

  const fixedOutflow = list.reduce((x,y)=>x+y.amount,0);
  const outflow = fixedOutflow + daily*DAYS;
  const burdenRatio = outflow / INCOME.amount;
  const score = Math.max(0, Math.min(100, Math.round(
    burdenRatio*25 + shortDays*3 + Math.min(maxShortfall/2000000,1)*35
  )));
  const level = score >= 60 ? "risk" : score >= 30 ? "warn" : "safe";
  return { series, firstShort, shortDays, maxShortfall, minBal, outflow, fixedOutflow, burdenRatio, score, level, daily, list };
}

const LEVEL = {
  risk:{ label:"위험", tone:"d", cls:"c-d", say:"결제일 전에 잔액이 모자랄 수 있어요" },
  warn:{ label:"주의", tone:"w", cls:"c-w", say:"여유가 빠듯한 구간이 있어요" },
  safe:{ label:"안정", tone:"g", cls:"c-g", say:"예정된 지출을 감당할 수 있어요" }
};

function catTotals(sim){
  const t = { card:0, bnpl:0, loan:0, fixed:0 };
  sim.list.forEach(i => t[i.cat] += i.amount);
  return t;
}

function monthlySeries(a){
  const sim = simulate(a);
  const has = id => sim.list.some(i => i.id === id);
  const newBnpl = a.stopBnpl ? 0 : NEW_BNPL_AVG;
  const m9  = sim.fixedOutflow - (has("bnpl3") ? 76000 : 0) + newBnpl;
  const m10 = m9 - (has("bnpl1") ? 89000 : 0);
  return [
    { m:"8월",  v:sim.fixedOutflow, est:false },
    { m:"9월",  v:m9,  est:true },
    { m:"10월", v:m10, est:true }
  ];
}

/* ═════════════════════════════════════════════════════════════════════
   5 · 표시 유틸 · 차트
   ═════════════════════════════════════════════════════════════════════ */
const won  = n => Math.round(n).toLocaleString("ko-KR");
const wonS = n => (n < 0 ? "-" : "") + won(Math.abs(n)) + "원";
const manS = n => won(Math.round(n/10000)) + "만원";
const esc  = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cashChart(series, id, compare){
  const W = 320, H = 148, PT = 10, PB = 22;
  const all = series.map(p=>p.bal).concat(compare ? compare.map(p=>p.bal) : []).concat([0]);
  const max = Math.max(...all), min = Math.min(...all), span = (max-min) || 1;
  const x = i => (i*W/(series.length-1)).toFixed(1);
  const y = v => (PT + (max-v)*(H-PT-PB)/span).toFixed(1);
  const y0 = y(0);
  const line = s => s.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.bal)}`).join(" ");
  const area = s => line(s) + ` L${x(s.length-1)},${y0} L${x(0)},${y0} Z`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="일별 예상 잔액 그래프">
    <defs>
      <clipPath id="up-${id}"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath>
      <clipPath id="dn-${id}"><rect x="0" y="${y0}" width="${W}" height="${(H-y0).toFixed(1)}"/></clipPath>
      <linearGradient id="gp-${id}" x1="0" y1="0" x2="0" y2="1">
        <stop class="cf-fill-pos-a" offset="0%"/><stop class="cf-fill-pos-b" offset="100%"/></linearGradient>
      <linearGradient id="gn-${id}" x1="0" y1="0" x2="0" y2="1">
        <stop class="cf-fill-neg-a" offset="0%"/><stop class="cf-fill-neg-b" offset="100%"/></linearGradient>
    </defs>
    ${compare ? `<path class="cf-prev" d="${line(compare)}"/>` : ""}
    <path d="${area(series)}" fill="url(#gp-${id})" clip-path="url(#up-${id})"/>
    <path d="${area(series)}" fill="url(#gn-${id})" clip-path="url(#dn-${id})"/>
    <line class="cf-pay" x1="${x(INCOME.day)}" y1="${PT}" x2="${x(INCOME.day)}" y2="${H-PB}"/>
    <line class="cf-zero" x1="0" y1="${y0}" x2="${W}" y2="${y0}"/>
    <path class="cf-line cf-pos" d="${line(series)}" clip-path="url(#up-${id})"/>
    <path class="cf-line cf-neg" d="${line(series)}" clip-path="url(#dn-${id})"/>
    <text class="cf-tick" x="2" y="${(y0-5).toFixed(1)}">0원</text>
    ${[1,10,20,25,31].map(d=>{
      const anchor = d === 1 ? "start" : d === DAYS ? "end" : "middle";
      return `<text class="cf-tick" x="${x(d)}" y="${H-6}" text-anchor="${anchor}">${d}일</text>`;
    }).join("")}
  </svg>`;
}

function monthBars(rows){
  const max = Math.max(...rows.map(r=>r.v));
  return `<div class="mbars">${rows.map(r=>`
    <div class="mbar">
      <span class="xs b8 num">${manS(r.v)}</span>
      <span class="col${r.est?" est":""}" style="height:${Math.max(10, Math.round(r.v/max*74))}px"></span>
      <span class="xs muted">${r.m}${r.est?" 예상":""}</span>
    </div>`).join("")}</div>`;
}

/* ═════════════════════════════════════════════════════════════════════
   6 · 앱 화면
   ═════════════════════════════════════════════════════════════════════ */
function view(o){
  return `<div class="app">
    <header class="appbar">
      ${o.back ? `<button class="iconbtn" data-act="go" data-to="${o.back}" aria-label="뒤로 가기">${ic("left")}</button>` : ""}
      <h2 class="apptitle">${o.title}</h2>
      ${o.action ? `<span class="act">${o.action}</span>` : ""}
    </header>
    <div class="appscroll enter">${o.body}</div>
    ${o.dock ? `<div class="dock">${o.dock}</div>` : ""}
    ${o.tab ? tabbar(o.tab) : ""}
  </div>`;
}

function tabbar(active){
  const t = [["home","home","홈"],["upcoming","calendar","예정 지출"],["actions","target","대응"],["settings","sliders","설정"]];
  return `<nav class="tabbar" aria-label="주요 메뉴">${t.map(([id,icon,label])=>`
    <button data-act="go" data-to="${id}" aria-current="${active===id}">${ic(icon)}${label}</button>`).join("")}</nav>`;
}

function gauge(score){
  const seg = score >= 60 ? 3 : score >= 30 ? 2 : 1;
  const cls = ["on-g","on-w","on-d"];   // 켜진 칸은 각자의 구간 색 — 차오르는 계기판
  return `<div class="gauge">
    <div class="gauge-track">${[0,1,2].map(i=>`<i class="${i<seg?cls[i]:""}"></i>`).join("")}</div>
    <div class="gauge-scale"><span>안정</span><span>주의</span><span>위험</span></div>
  </div>`;
}

/* ── 3 · 예정 지출 ─────────────────────────────────────────────────── */
function scUpcoming(){
  const sim = simulate(S.applied || {});
  const list = sim.list.slice().sort((a,b)=>a.day-b.day);
  const shown = S.tab === "all" ? list : list.filter(i=>i.cat===S.tab);
  const sum = shown.reduce((a,b)=>a+b.amount,0);
  const tabs = [["all","전체"]].concat(Object.keys(CATS).map(k=>[k, CATS[k].name]));

  // 날짜별 묶기
  const groups = [];
  shown.forEach(it => {
    let g = groups.find(x=>x.day===it.day);
    if (!g){ g = { day:it.day, items:[] }; groups.push(g); }
    g.items.push(it);
  });
  if (S.tab === "all") groups.push({ day:INCOME.day, income:true, items:[] });
  groups.sort((a,b)=>a.day-b.day);

  return view({ title:"예정 지출", back:"home", body:`
    <div class="chips">
      ${tabs.map(([k,l])=>`<button data-act="tab" data-id="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")}
    </div>

    <div class="card flat" style="margin-top:var(--space-sm)">
      <div class="row" style="padding:0;min-height:0">
        <span class="grow">
          <span class="xs muted">${MONTH}월 ${S.tab==="all"?"전체":CATS[S.tab].name} 예정액</span>
          <span class="big num" style="display:block">${won(sum)}원</span>
        </span>
        <button class="linkbtn" data-act="openFixed">고정비 추가</button>
      </div>
    </div>

    <div class="sec"><h3>결제 일정</h3><span class="note">${shown.length}건</span></div>
    ${groups.map(g=>`
      <div class="daygroup">
        <p class="dayhead">${MONTH}월 ${g.day}일</p>
        <div class="card pad-list">
          ${g.items.map(it=>{
            const bal = sim.series[it.day].bal;
            return `<div class="row">
              <span class="av ${CATS[it.cat].tone}">${ic(CATS[it.cat].ico)}</span>
              <span class="grow">
                <span class="t-name">${esc(it.name)}${it.shifted?' <span class="tag b">날짜 변경</span>':""}${it.custom?' <span class="tag">직접 입력</span>':""}</span>
                <span class="t-sub">${esc(it.desc||"고정비")}</span>
              </span>
              <span class="end">
                <span class="amt num">-${won(it.amount)}</span>
                <span class="t-sub num ${bal<0?"c-d":""}">잔액 ${wonS(bal)}</span>
              </span>
              ${it.custom?`<button class="linkbtn d" data-act="delFixed" data-id="${it.id}">삭제</button>`:""}
            </div>`;
          }).join("")}
          ${g.income?`<div class="row">
            <span class="av g">${ic("wallet")}</span>
            <span class="grow"><span class="t-name">${INCOME.name}</span><span class="t-sub">${INCOME.src}</span></span>
            <span class="end"><span class="amt num c-g">+${won(INCOME.amount)}</span></span>
          </div>`:""}
        </div>
      </div>`).join("")}

    <div class="sec"><h3>달마다 부담이 어떻게 변할까요</h3></div>
    <div class="card">
      ${monthBars(monthlySeries(S.applied || {}))}
      <div class="hr"></div>
      <p class="xs muted">9~10월은 <b>예상치</b>예요. 분할결제가 끝나는 일정(C마트 8월 · A쇼핑 9월)과
        최근 3개월 평균 신규 분할결제 금액(${won(NEW_BNPL_AVG)}원)을 반영했고, 금액이 확정되면 자동으로 바뀌어요.</p>
    </div>
  `, dock:`<button class="btn" data-act="go" data-to="explain">이 부담이 위험한 이유</button>`, tab:"upcoming" });
}

/* ── 4 · AI 원인 설명 ──────────────────────────────────────────────── */
function scExplain(){
  const sim = simulate(S.applied || {});
  const L = LEVEL[sim.level];
  const t = catTotals(sim);
  const card = sim.list.find(i=>i.id==="card");
  const lowDay = sim.firstShort ||
    sim.series.reduce((m,p,i)=> (i>0 && p.bal < sim.series[m].bal) ? i : m, 1);
  const cardEarly = card && card.day < INCOME.day;

  const grounds = [
    { t:`${MONTH}월 ${lowDay}일에 잔액이 ${wonS(sim.series[lowDay].bal)}까지 내려가요`,
      d: cardEarly
        ? `${MONTH}월 ${card.day}일에 카드값 ${won(card.amount)}원이 빠져나가는데 월급은 ${INCOME.day}일에 들어와요. 나갈 돈이 들어올 돈보다 ${INCOME.day-card.day}일 먼저 움직여요.`
        : `카드 결제일(${card?card.day:"-"}일)이 월급날(${INCOME.day}일) 뒤로 옮겨져서, 큰 지출이 돈이 들어온 다음에 발생해요.` },
    { t:`분할결제 3건이 5일·12일·20일에 나눠서 ${won(t.bnpl)}원 빠져나가요`,
      d:"한 번에 큰돈은 아니지만 카드 결제일 앞뒤로 흩어져 있어서, 결제일에 남아 있어야 할 잔액을 미리 깎아요." },
    { t:`버는 돈의 ${Math.round(sim.burdenRatio*100)}%가 이미 나갈 예정이에요`,
      d:`예정 지출과 생활비 예상액을 더하면 ${manS(sim.outflow)}으로, 월 소득 ${manS(INCOME.amount)}에 거의 닿아요. 갑작스러운 지출이 생기면 다음 달로 부담이 넘어갈 수 있어요.` }

  return view({ title:"AI 분석 설명", back:"home", body:`
    <div class="card">
      <div class="row" style="padding:0;min-height:0;align-items:flex-start">
        <span class="av ${L.tone}">${ic("bulb")}</span>
        <span class="grow">
          <span class="tag ${L.tone}">위험 ${L.label} · ${sim.score}점</span>
          <p class="t-name" style="margin-top:var(--space-xs);line-height:1.5;font-size:var(--text-lg)">
            ${sim.firstShort
              ? `${MONTH}월 ${sim.firstShort}일부터 ${sim.shortDays}일 동안 잔액이 모자랄 것 같아요. 가장 큰 이유는 <span class="c-b">카드 결제일이 월급날보다 앞서 있기 때문</span>이에요.`
              : `지금 예정된 지출은 이번 달 소득과 잔액으로 감당할 수 있어요. 다만 부담률이 ${Math.round(sim.burdenRatio*100)}%라 여유가 크지는 않아요.`}
          </p>
        </span>
      </div>
    </div>

    <div class="sec"><h3>이렇게 판단했어요</h3></div>
    <div class="card">
      <div class="steps">
        ${grounds.map((g,i)=>`<div class="step">
          <span class="n">${i+1}</span>
          <span class="grow">
            <span class="t-name" style="line-height:1.45">${g.t}</span>
            <span class="t-sub" style="line-height:1.55;margin-top:4px;display:block">${g.d}</span>
          </span>
        </div>`).join("")}

/* ── 5 · 대응 방법 ─────────────────────────────────────────────────── */
function scActions(){
  const base = simulate(S.applied || {});
  const prev = simulate(S.actions);
  const picked = Object.values(S.actions).filter(Boolean).length;
  const PL = LEVEL[prev.level];
  const delta = base.score - prev.score;

  return view({ title:"대응 방법", back:"explain", body:`
    <p class="lede">${USER}님이 <b>직접 할 수 있는 방법</b>만 알려드려요. FinGuard가 대신 결제하거나 해지하지 않아요.</p>

    <div class="card tint-b" style="margin-top:var(--space-md)">
      <div class="row" style="padding:0;min-height:0">
        <span class="grow">
          <span class="xs c-b b7">고르면 예상되는 위험 점수</span>
          <span style="display:flex;align-items:baseline;gap:var(--space-xs);margin-top:2px">
            <span class="big num muted strike">${base.score}</span>
            <span class="muted">→</span>
            <span class="huge num ${PL.cls}">${prev.score}</span>
            <span class="tag ${PL.tone}">${PL.label}</span>
          </span>
        </span>
        <span class="end">
          <span class="xs c-b">가장 낮은 잔액</span>
          <span class="amt num ${prev.minBal<0?"c-d":"c-g"}" style="display:block">${wonS(prev.minBal)}</span>
          <span class="t-sub">부족 ${prev.shortDays}일</span>
        </span>
      </div>
      ${delta > 0 ? `<p class="xs c-g b7" style="margin-top:var(--space-sm)">${delta}점 낮아져요</p>`
                  : `<p class="xs muted" style="margin-top:var(--space-sm)">방법을 고르면 결과가 바로 다시 계산돼요</p>`}
    </div>

    <div class="sec"><h3>추천하는 방법</h3><span class="note">${picked}개 선택</span></div>
    ${ACTIONS.map(a=>{
      const on = S.actions[a.id];
      return `<button class="pick" data-act="toggleAction" data-id="${a.id}" aria-pressed="${on}">
        <span class="row" style="padding:0;min-height:0;align-items:flex-start">
          <span class="av ${a.tone}">${ic(a.ico)}</span>
          <span class="grow">
            <span class="t-name" style="line-height:1.45">${a.title}</span>
            <span class="t-sub" style="line-height:1.55;margin-top:4px;display:block">${a.desc}</span>
            <span style="display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)">
              <span class="tag ${a.tone||"b"}">${a.effect}</span><span class="tag">${a.how}</span>
            </span>

        </span>
      </button>`;
    }).join("")}

    <div class="note">${ic("ban")}<span>추가 대출·리볼빙·새 카드 같은 <b>금융상품은 제안하지 않아요.</b> 지금 있는 지출과 일정을 조정하는 범위에서만 계산해요.</span></div>

        <span><i></i>적용 전</span><span><i class="b"></i>적용 후</span><span><i class="d"></i>잔액 부족</span>

  const m = PRD[S.screen] || PRD.home;
  const s = SCREENS.find(x=>x.id===S.screen);
  const block = (title, arr, cls) => arr && arr.length
    ? `<h4>${title}</h4><ul>${arr.map(x=>`<li class="${cls||""}">${x}</li>`).join("")}</ul>` : "";
  document.getElementById("spec").innerHTML =
    `<button class="close" data-act="closeSpec" aria-label="닫기">${ic("close")}</button>
     <h3>${s.t}</h3><p class="lede">${m.lede}</p>` +
    block("충족하는 수용 기준", m.acc, "acc") +
    block("관련 KPI", m.kpi) +
    block("리스크 대응", m.risk);
}

/* ═════════════════════════════════════════════════════════════════════
   8 · 렌더 / 이벤트
   ═════════════════════════════════════════════════════════════════════ */
const RENDER = { connect:scConnect, home:scHome, upcoming:scUpcoming, explain:scExplain,
                 actions:scActions, result:scResult, settings:scSettings };

function render(){
  document.getElementById("rail").innerHTML =
    `<p class="rail-h">화면 흐름</p>` + SCREENS.map((s,i)=>`
      <button data-act="go" data-to="${s.id}" aria-current="${S.screen===s.id}">
        <span class="n">${i+1}</span>
        <span><span class="t">${s.t}</span><span class="d">${s.d}</span></span>
      </button>`).join("");

  const single = S.view === "single";
  const stage = document.getElementById("stage");
  stage.classList.toggle("gallery-mode", !single);
  document.getElementById("device").classList.toggle("hidden", !single);
  document.getElementById("gallery").classList.toggle("on", !single);

  if (single){
    document.getElementById("device").innerHTML = RENDER[S.screen]();
  } else {
    document.getElementById("gallery").innerHTML = SCREENS.map((s,i)=>`
      <figure class="film">
        <figcaption><span class="n">${i+1}</span>${s.t}</figcaption>
        <div class="device">${RENDER[s.id]()}</div>
      </figure>`).join("");
  }

  document.querySelectorAll("#viewSeg button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
  document.getElementById("spec").classList.toggle("open", S.specOpen);
  renderSpec();
  renderModal();
}

function toast(msg){
  const r = document.getElementById("toastRoot");
  r.innerHTML = `<div class="toast" role="status">${msg}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ r.innerHTML = ""; }, 2400);
}

document.addEventListener("click", e => {
  const seg = e.target.closest("#viewSeg button");
  if (seg){ S.view = seg.dataset.view; render(); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "closeModal" && e.target.closest("[data-stop]")) return;

  const a = el.dataset.act, id = el.dataset.id;

  switch (a){
    case "go":
      S.screen = el.dataset.to;
      if (S.view === "gallery") S.view = "single";
      break;

    case "toggleInst":
      S.connected = S.connected.includes(id) ? S.connected.filter(x=>x!==id) : S.connected.concat(id);
      break;

    case "toggleConsent": S.consents[id] = !S.consents[id]; break;

    case "connect":
      S.connecting = true; render();
      setTimeout(()=>{ S.connecting = false; S.screen = "home"; render(); toast("분석을 마쳤어요 · 1.2초"); }, 1500);
      return;

    case "tab": S.tab = id; break;
    case "toggleAction": S.actions[id] = !S.actions[id]; break;

    case "apply":
      S.applied = Object.assign({}, S.actions);
      S.screen = "result";
      break;

    // 되돌리기·초기화는 화면에서 결과가 바로 보이므로 토스트를 띄우지 않는다 (silent success)
    case "undo":
      S.applied = null; S.actions = DEFAULT_STATE().actions;
      break;

    case "openFixed":  S.modal = "fixed"; break;
    case "openReport": S.modal = "report"; break;
    case "closeModal": S.modal = null; break;
    case "openSpec":   S.specOpen = true; break;
    case "closeSpec":  S.specOpen = false; break;

    case "saveFixed": {
      const n = (document.getElementById("fxName").value || "").trim();
      const amt = parseInt(document.getElementById("fxAmt").value, 10);
      const day = parseInt(document.getElementById("fxDay").value, 10);
      if (!n || !amt || !day || day < 1 || day > 31){
        toast("이름·금액·날짜(1~31일)를 확인해 주세요"); return;
      }
      S.customFixed.push({ id:"fx"+Date.now(), cat:"fixed", name:n, desc:"직접 입력", day, amount:amt, custom:true });
      S.modal = null;
      toast("고정비를 반영해 다시 계산했어요");
      break;
    }

    case "delFixed":
      S.customFixed = S.customFixed.filter(f => f.id !== id);
      break;

    case "sendReport":
      S.modal = null;
      toast("신고를 접수했어요 · 운영 검토 예정");
      break;

    case "disconnect":
      S.connected = S.connected.filter(x => x !== id);
      toast("연결을 끊고 데이터를 파기했어요");
      break;

    case "reset": {
      const v = S.view;
      S = DEFAULT_STATE(); S.view = v;
      break;
    }
  }
  render();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (S.modal){ S.modal = null; render(); }
    else if (S.specOpen){ S.specOpen = false; render(); }
  }
});

render();
</script>
